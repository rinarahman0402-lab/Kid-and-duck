<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kid and Duck Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        #container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 60%, #55B935 60%, #3B8721 100%);
        }

        #caption-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #FFF;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            max-width: 80%;
            border: 2px solid #FFD700;
            transition: opacity 0.3s;
        }

        #controls {
            margin-top: 15px;
        }

        button {
            background-color: #FFD700;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, background-color 0.2s;
        }

        button:hover {
            background-color: #FFC000;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div id="container">
    <canvas id="canvas" width="800" height="450"></canvas>
    <div id="caption-box">Click "Play Animation" to Start</div>
</div>

<div id="controls">
    <button onclick="startAnimation()">Play Animation</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const captionBox = document.getElementById('caption-box');

let frame = 0;
let state = "talking"; // "talking" or "riding"
let animationId = null;

// Audio setup using Web Speech API
const speech = new SpeechSynthesisUtterance("Hey Mr. Duck, where are we going?");
speech.pitch = 1.6; // High pitch for kid voice
speech.rate = 1.0;

function speakDialogue() {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(speech);
    }
}

function drawSun() {
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(720, 80, 40, 0, Math.PI * 2);
    ctx.fill();
}

function drawDuck(x, y, scale = 1, isMoving = false) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    const waddle = isMoving ? Math.sin(frame * 0.2) * 8 : 0;
    ctx.translate(0, waddle);

    // Body
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.ellipse(0, 0, 70, 50, 0, 0, Math.PI * 2);
    ctx.fill();

    // Tail
    ctx.beginPath();
    ctx.moveTo(-60, -10);
    ctx.lineTo(-85, -30);
    ctx.lineTo(-65, 10);
    ctx.closePath();
    ctx.fill();

    // Wing
    ctx.fillStyle = '#F0F0F0';
    ctx.beginPath();
    ctx.ellipse(-10, 5, 35, 20, Math.PI / 6, 0, Math.PI * 2);
    ctx.fill();

    // Head
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(45, -45, 35, 0, Math.PI * 2);
    ctx.fill();

    // Eye
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(55, -55, 5, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#FF8C00';
    ctx.beginPath();
    ctx.ellipse(75, -40, 20, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Feet
    if (!isMoving) {
        ctx.fillRect(-20, 45, 12, 20);
        ctx.fillRect(10, 45, 12, 20);
    } else {
        const leg1 = Math.sin(frame * 0.2) * 15;
        const leg2 = -Math.sin(frame * 0.2) * 15;
        ctx.fillRect(-20 + leg1, 45, 12, 20);
        ctx.fillRect(10 + leg2, 45, 12, 20);
    }

    ctx.restore();
}

function drawKid(x, y, scale = 1, isRiding = false) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    if (isRiding) {
        const bobbing = Math.sin(frame * 0.2) * 8;
        ctx.translate(0, bobbing);
        
        // Head
        ctx.fillStyle = '#FFCC99';
        ctx.beginPath();
        ctx.arc(0, -70, 18, 0, Math.PI * 2);
        ctx.fill();

        // Hair
        ctx.fillStyle = '#654321';
        ctx.beginPath();
        ctx.arc(0, -75, 20, Math.PI, Math.PI * 2);
        ctx.fill();

        // Shirt
        ctx.fillStyle = '#FF4500';
        ctx.fillRect(-12, -52, 24, 30);

        // Legs straddling duck
        ctx.fillStyle = '#1E90FF';
        ctx.fillRect(-20, -28, 12, 25);
        ctx.fillRect(8, -28, 12, 25);
    } else {
        // Talking stance (sitting/standing in front of duck)
        const mouthOpen = Math.sin(frame * 0.3) > 0 ? 4 : 0;

        // Head
        ctx.fillStyle = '#FFCC99';
        ctx.beginPath();
        ctx.arc(0, 0, 20, 0, Math.PI * 2);
        ctx.fill();

        // Hair
        ctx.fillStyle = '#654321';
        ctx.beginPath();
        ctx.arc(0, -5, 22, Math.PI, Math.PI * 2);
        ctx.fill();

        // Mouth (talking animation)
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(5, 5, 3 + mouthOpen, 0, Math.PI * 2);
        ctx.fill();

        // Body
        ctx.fillStyle = '#FF4500';
        ctx.fillRect(-15, 20, 30, 35);

        // Pants
        ctx.fillStyle = '#1E90FF';
        ctx.fillRect(-15, 55, 30, 20);
    }

    ctx.restore();
}

let duckX = 450;
let duckY = 280;
let kidX = 250;
let kidY = 280;

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawSun();

    frame++;

    if (state === "talking") {
        captionBox.innerText = 'Child: "Hey Mr. Duck, where are we going?"';
        drawDuck(duckX, duckY, 1.3, false);
        drawKid(kidX, kidY, 1, false);

        if (frame > 180) { // After ~3 seconds, switch to riding
            state = "riding";
            captionBox.innerText = '*Child jumps on the duck and starts riding!*';
        }
    } else if (state === "riding") {
        duckX += 2.5; // Duck waddles forward
        
        // Wrap around screen
        if (duckX > 950) {
            duckX = -100;
        }

        drawDuck(duckX, duckY, 1.3, true);
        drawKid(duckX + 10, duckY - 20, 1, true);
    }

    animationId = requestAnimationFrame(animate);
}

function startAnimation() {
    if (animationId) {
        cancelAnimationFrame(animationId);
    }
    frame = 0;
    duckX = 450;
    duckY = 280;
    kidX = 250;
    kidY = 280;
    state = "talking";
    
    speakDialogue();
    animate();
}

// Draw initial frame
drawSun();
drawDuck(450, 280, 1.3, false);
drawKid(250, 280, 1, false);
</script>

</body>
</html>
